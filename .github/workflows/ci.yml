# Build every lab and run BPF_PROG_TEST_RUN unit tests on a real kernel.
# The course's primary target is Linux 7.0 (Ubuntu 26.04), tested locally with
# `make test`; this hosted-runner job is an extra CO-RE compatibility check.
# GitHub's ubuntu-24.04 runners are full VMs with BTF and passwordless sudo,
# so eBPF programs can be loaded and test-run (but not attached to real NICs).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev gcc-multilib bpftrace
          sudo apt-get install -y "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-azure linux-tools-generic
          # clang -target bpf needs <asm/...> from the multiarch include dir
          [ -e /usr/include/asm ] || sudo ln -s /usr/include/x86_64-linux-gnu/asm /usr/include/asm

      - name: Kernel info
        run: |
          uname -a
          ls -l /sys/kernel/btf/vmlinux
          bpftool version || true

      - name: Generate vmlinux.h from runner kernel BTF
        run: make vmlinux

      - name: Build all labs
        run: make all

      - name: Run BPF_PROG_TEST_RUN unit tests
        run: make test

      - name: Syntax-check scripts
        run: |
          bash -n scripts/setup_env.sh phase01-network-foundation/*/*.sh
          python3 -m py_compile phase01-network-foundation/week01-packet-netns/raw_sniffer.py phase02-first-step-ebpf/week04-bcc-python/tcp_v4_latency.py

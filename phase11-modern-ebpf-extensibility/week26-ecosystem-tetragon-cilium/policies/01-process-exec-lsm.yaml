# Week 26 / Policy 01: process execution observability (exec/exit + LSM view)
#
# process_exec / process_exit events are produced by Tetragon's always-on
# "__base__" sensor (no policy needed). This policy ADDS a BPF LSM hook on
# bprm_check_security (the same hook family as week 10) so we also see the
# kernel's "may this binary be executed?" check, but only for the lab binary
# lab-files/bin/w26-hello. Observe only: no matchActions => default action Post.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "w26-process-exec-lsm"
spec:
  lsmhooks:
  - hook: "bprm_check_security"
    args:
    - index: 0
      type: "linux_binprm"          # Tetragon resolves bprm->file to a path
    selectors:
    - matchArgs:
      - index: 0
        operator: "Postfix"         # suffix match: works wherever the repo is cloned
        values:
        - "week26-ecosystem-tetragon-cilium/lab-files/bin/w26-hello"

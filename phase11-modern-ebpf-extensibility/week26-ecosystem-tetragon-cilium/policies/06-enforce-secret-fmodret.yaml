# Week 26 / Policy 06: ENFORCEMENT with Override on a kprobe-style hook (fmod_ret)
#
# Same goal as policy 05 (open() of lab-files/secret.txt -> -EPERM), but written
# as `kprobes:` on the kernel function security_file_open instead of `lsmhooks:`.
#
# How Tetragon v1.7 implements Override (pkg/sensors/tracing/generickprobe.go):
#   * security_* functions -> BPF trampoline fmod_ret (BPF_MODIFY_RETURN, week 22);
#     the verifier allows fmod_ret only on security_* hooks or on functions in the
#     error-injection list. kprobe_multi links cannot do this, so the daemon must
#     run with --disable-kprobe-multi:
#         TETRAGON_ARGS="--disable-kprobe-multi" ./run-tetragon.sh up
#   * syscalls (syscall: true) -> bpf_override_return(), which needs
#     CONFIG_BPF_KPROBE_OVERRIDE=y and works only on functions marked
#     ALLOW_ERROR_INJECTION (see /sys/kernel/debug/error_injection/list).
#   * any other kernel function -> rejected ("override action can be used only
#     with syscalls and security_ hooks").
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "w26-enforce-secret-fmodret"
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "week26-ecosystem-tetragon-cilium/lab-files/secret.txt"
      matchActions:
      - action: Override
        argError: -1                  # -EPERM
      - action: Post

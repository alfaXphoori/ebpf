# Week 26 / Policy 04: ENFORCEMENT with Sigkill
#
# Any process that opens lab-files/secret.txt (and ONLY that lab file) receives
# SIGKILL from inside the BPF program (bpf_send_signal), before open() returns
# to user space, so the process never gets to read() the data.
# Safety: the match is a suffix that only exists inside this lab folder.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "w26-enforce-secret-sigkill"
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "week26-ecosystem-tetragon-cilium/lab-files/secret.txt"
      matchActions:
      - action: Sigkill               # kill the calling process
      - action: Post                  # and still emit an event for the audit trail

# Week 26 / Policy 05: ENFORCEMENT with Override (deny instead of kill)
#
# A BPF LSM hook on file_open returns -1 (-EPERM) for lab-files/secret.txt, so
# open() fails with "Operation not permitted" and the process keeps running.
# This is exactly what week 10 built by hand with SEC("lsm/file_open").
# Needs BPF LSM active ("bpf" in /sys/kernel/security/lsm).
#
# Why lsmhooks and not `kprobes:` + Override? Both work on Linux 7.0, but a kprobe
# Override on security_file_open is implemented by Tetragon as a BPF trampoline
# fmod_ret program, which cannot be combined with kprobe_multi links, so the daemon
# must be started with --disable-kprobe-multi (see policy 06). The LSM hook works
# with the default daemon flags.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "w26-enforce-secret-override"
spec:
  lsmhooks:
  - hook: "file_open"
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "week26-ecosystem-tetragon-cilium/lab-files/secret.txt"
      matchActions:
      - action: Override
        argError: -1                  # -EPERM
      - action: Post
